<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing Pro Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='writingpro.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script type="module" src="{{ url_for('static', filename='writingpro.js') }}" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

</head>
<body data-bs-theme="light">
    <header class="d-flex justify-content-between align-items-center w-100 py-3 px-4">
        <div class="d-flex align-items-center gap-3">
            <img src="{{ url_for('static', filename='author.png') }}" alt="Logo" class="img-fluid" style="width: 60px;">
            <h1 class="mb-0">Writing Pro</h1>
        </div>
        <nav class="d-flex gap-3">
            <a href="{{ url_for('index') }}" class="btn btn-link" style="color: var(--bs-body-color);">Home</a>
            <a href="{{ url_for('my_writings_page') }}" class="btn btn-link" style="color: var(--bs-body-color);">My Writings</a>
            <a href="{{ url_for('generator') }}" class="btn btn-link" style="color: var(--bs-body-color);">Generator</a>
            <a href="{{ url_for('settings') }}" class="btn btn-link" style="color: var(--bs-body-color);">Settings</a>
        </nav>
    </header>
    <main>
        <div id="interfaceSettings">
            <h1>Interface Settings:</h2>
            <button class="btn btn-secondary m-3" id="darkModeButton">Toggle Dark Mode</button>
            <div class="d-flex align-items-center gap-3 mb-3">
                <label for="fontSizeSelector" class="form-label mb-0">Font Size:</label>
                <select id="fontSizeSelector" class="form-select w-auto">
                    <option value="sm">Small</option>
                    <option value="md" selected>Medium</option>
                    <option value="lg">Large</option>
                </select>
            </div>
            <div class="d-flex align-items-center gap-3 mb-3">
                <label for="fontFamilySelector" class="form-label mb-0">Font Type:</label>
                <select id="fontFamilySelector" class="form-select w-auto">
                    <option value="default">Courier</option>
                    <option value="serif">Serif</option>
                    <option value="sans">Sans-serif</option>
                    <option value="mono">Monospace</option>
                    <option value="modern">Modern</option>
                    <option value="comic">Comic Sans (fun mode)</option>
                </select>
            </div>
            <div class="d-flex align-items-center gap-3 mb-3">
                <label for="voiceSelector" class="form-label mb-0">Select your voice:</label>
                <select id="voiceSelector" class="form-select w-auto">
                </select>
                <button id="tryVoiceBtn" class="btn">Try Voice</button>
            </div>
            <button id="resetSettings" class="btn btn-danger">Reset Settings</button>
        </div>
    </main>
</body>
</html>
