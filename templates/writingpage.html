<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Writing Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='writingpro.css') }}">    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script type="module" src="{{ url_for('static', filename='writingpro.js') }}" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body data-bs-theme="light">
  <header class="d-flex justify-content-between align-items-center w-100 py-3 px-4">
    <div class="d-flex align-items-center gap-3">
      <img src="{{ url_for('static', filename='author.png') }}" alt="Logo" class="img-fluid" style="width: 60px;">
      <h1 class="mb-0">Writing Pro</h1>
    </div>
    <nav class="d-flex gap-3">
      <a href="{{ url_for('index') }}" class="btn btn-link" style="color: var(--bs-body-color);">Home</a>
      <a href="{{ url_for('my_writings_page') }}" class="btn btn-link" style="color: var(--bs-body-color);">My Writings</a>
      <a href="{{ url_for('generator') }}" class="btn btn-link" style="color: var(--bs-body-color);">Generator</a>
      <a href="{{ url_for('settings') }}" class="btn btn-link" style="color: var(--bs-body-color);">Settings</a>
    </nav>
  </header>
  <div class="container-fluid">
    <main class="writingpage px-4">
      <form action="{{ url_for('update_work', id=work['id']) if work else url_for('add_work') }}" method="post">
        <input name="title" id="title" type="text" placeholder="Enter your title:" class="form-control mb-2" value="{{ work['title'] if work else '' }}">
        
        <div class="editor-wrapper position-relative">
          <div id="highlightedOutput" class="highlight-layer" style="white-space: pre-wrap;"></div>
          <textarea name="text" id="textbox" class="text-layer form-control mb-3" rows="20" placeholder="Begin writing here..." oninput="syncText()" style="color: var(--bs-body-color)">{{ work['text'] if work else '' }}</textarea>
        </div>

        <div class="d-flex flex-wrap gap-2 mb-3">
          <button type="submit" id="save" class="btn btn-success me-2"><i class="fa fa-folder"></i>{{ ' Update' if work else ' Save' }}</button>
          <button type="button" id="download" class="btn btn-secondary"><i class="fa fa-download"></i> Download</button>
          <button id="clear" class="btn btn-danger"><i class="fa fa-trash"></i> Clear</button>
          <input type="file" id="myFile" name="filename">
          <button id="insert">Insert</button>
          <button id="textToSpeech" class="btn btn-primary">Read Aloud</button>
        </div>
      </form>
      <div class="check d-flex flex-column align-items-center p-3 border-start">
        <button type="button" id="checkWriting" class="btn btn-success"><span class="spinner-border spinner-border-sm d-none me-2" id="loadingSpinner" role="status" aria-hidden="true"></span>Check My Writing</button>
        <div id="results" class="w-100 mb-3"></div>
      </div>
    </main>
    <footer>
        
    </footer>
  </div>

  <div id="downloadModal" class="modal">
    <div class="modal-content">
      <p>Export as PDF or TXT?</p>
      <button id="pdfButton">PDF</button>
      <button id="txtButton">TXT</button>
      <button id="cancelButton">Cancel</button>
    </div>
  </div>

  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/1.0.272/jspdf.debug.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.4.1/html2canvas.js"></script>
</body>
</html>
